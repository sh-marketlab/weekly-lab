# 量價背離（src/divergence.py）。數字都可以直接改，下次排程生效。
# 相對量 = 當日成交股數 ÷ 前 20 日平均股數；收盤位置 = −1（收最低）～ +1（收最高）

day:
  min_move: 0.5         # 承接／出貨：當天漲跌幅絕對值 ≥ 0.5% 才判斷
  lowvol_min_move: 1.0  # 虛漲／量縮跌：漲跌幅絕對值 ≥ 1%（量縮很常見，門檻放低每天會冒出 20 檔）
  low_rv: 0.8       # 相對量 < 0.8 算「量縮」
  high_rv: 1.5      # 相對量 ≥ 1.5 算「放大量」
  clv: 0.3          # 收盤位置 ≥ 0.3 算收在高檔、≤ −0.3 算收在低檔

week:
  min_days: 4       # 這週至少有幾天資料才判斷量能衰退
  fade_ratio: 0.7   # 最後兩天平均相對量 ≤ 前兩天平均 × 0.7 → 量能衰退
  min_move: 1.0     # 週漲跌幅絕對值 ≥ 1% 才判斷

track:
  days: [5, 10, 20, 40]   # 追蹤幾個交易日後的表現（約 1／2／4／8 週）
  recent_weeks: 4         # 頁面列出最近幾週的背離事件
