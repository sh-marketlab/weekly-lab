# 量價資金流觀察名單（docs/flow.html 使用）
# 頁面上的板塊順序與分組照這個檔案排列。要增減標的、改板塊或改分組，直接改這裡。
# 一檔只能出現在一個板塊；GEV 單獨放在「未來能源/電網基礎建設」。

groups:
  - name: 科技巨頭 vs 半導體
    note: 指數靠老大撐，弟妹股是否在撤
    sectors:
      - name: 科技
        tickers: [AAPL, NVDA, GOOG, MSFT, AMZN, TSLA, META]
      - name: 半導體
        tickers: [AMAT, ASML, CDNS, SNPS, ARM, MRVL, AMD, AVGO, INTC]

  - name: 防禦・抗通膨
    note: 金融、民生必需、糧食與水
    sectors:
      - name: 金融
        tickers: [V, MA, BLK, JPM, GS, BNY, CRCL, COIN]
      - name: 民生消費
        tickers: [WMT, COST, KO, PG, SCHD]
      - name: 糧食/水資源
        tickers: [ADM, CNI, XYL, AWK, DE]

  - name: 能源
    note: 傳統能源 vs 未來能源
    sectors:
      - name: 石油
        tickers: [OXY, CVX, XOM, LNG]
      - name: 未來能源
        tickers: [CEG, NEE, BE, VST]
      - name: 未來能源/電網基礎建設
        tickers: [GEV]

  - name: 量長太
    note: 對利率最敏感的遠期題材
    sectors:
      - name: 太空
        tickers: [ASTS, BKSY, IRDM, PL, SPCX, RKLB]
      - name: 量子
        tickers: [IONQ, QNT, QUBT, QBTS]
      - name: 長壽
        tickers: [CRSP, VRTX, TWST, TEM, RXRX, NTLA, UNH]

  - name: AI 軟體與資安
    note: ""
    sectors:
      - name: AI軟體
        tickers: [PLTR, NOW, VEEV, INTU, WDAY, CRM, SNOW, BSY]
      - name: 資安
        tickers: [PANW, CRWD, FTNT, NET, ZS]

  - name: AI 基礎設施
    note: 資料中心與電網
    sectors:
      - name: 資料中心
        tickers: [EQIX, AMT, DLR]
      - name: 電網基礎建設
        tickers: [ETN, PWR, HUBB, VRT]

  # ---- 新版才納入（extended: true）：原版 77 檔不含這組，頁面上可切換「新版／原版」
  - name: 跨資產對照
    note: 奢侈品看高端消費，美債看避險與利率
    extended: true
    sectors:
      - name: 奢侈精品
        tickers: [LVMUY, CFRUY, HESAY]
      - name: 美國債券
        tickers: [TLT, IEF, EDV]
