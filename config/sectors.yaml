# 第 2 項：跨資產板塊週變化（對應 Finviz futures map 的欄位）
#
# 期貨/指數本身沒有「市值」，所以金額用兩個口徑還原：
#
#   basket    → 成分股市值加總（REIT 那幾組），這是真市值
#   mcap      → 該標的本身有流通市值（加密幣）
#   proxy     → 追蹤該資產的 ETF 資產規模（其餘全部）
#
# proxy 口徑要注意：那是「這檔 ETF 有多大」，不是「整個黃金市場有多大」。
# 用途是看資金進出的方向與相對強弱，不是絕對規模。
#
# 有了 base 之後可以算兩個不同的東西：
#   市值變化 = base × r/(1+r)        ← 價格造成的帳面增減
#   資金流   = base_now − base_prev×(1+r)  ← 扣掉價格效應後的淨申購/贖回
# 第二個才是真正的「錢進來了還是出去了」，需要兩週以上的快照才算得出來。

groups:
  原物料:
    - {name: Gold,       ticker: "GC=F", proxy: GLD}
    - {name: Silver,     ticker: "SI=F", proxy: SLV}
    - {name: Copper,     ticker: "HG=F", proxy: CPER, note: 銅博士，工業活力領先指標}
    - {name: Palladium,  ticker: "PA=F", proxy: PALL}
    - {name: Platinum,   ticker: "PL=F", proxy: PPLT}

  股票:
    - {name: S&P 500,       ticker: "^GSPC",     proxy: SPY}
    - {name: Nasdaq 100,    ticker: "^NDX",      proxy: QQQ}
    - {name: Russell 2000,  ticker: "^RUT",      proxy: IWM}
    - {name: DJIA,          ticker: "^DJI",      proxy: DIA}
    - {name: Euro Stoxx 50, ticker: "^STOXX50E", proxy: FEZ}
    - {name: DAX,           ticker: "^GDAXI",    proxy: EWG}
    - {name: Nikkei 225,    ticker: "^N225",     proxy: EWJ}

  # 注意：這裡是「債券期貨價格」的週變化，不是殖利率。
  # 期貨價漲 = 殖利率跌。與 Step 1 的 #7 / #9（殖利率）方向相反，別看反了。
  債券:
    - {name: 30Y T-Bond, ticker: "ZB=F", proxy: TLT}
    - {name: 10Y T-Note, ticker: "ZN=F", proxy: IEF}
    - {name: 5Y T-Note,  ticker: "ZF=F", proxy: IEI}
    - {name: 2Y T-Note,  ticker: "ZT=F", proxy: SHY}

  # Finviz 的 REIT 產業分類沒有對應的單一報價，改用「等權個股籃子」還原，
  # 好處是完全透明、可回溯、而且這些成分股本來就有市值可以算金額。
  不動產REITs:
    - {name: IT & Telecom, basket: [AMT, CCI, EQIX, DLR, SBAC]}
    - {name: Warehousing,  basket: [PLD, PSA, EXR, FR]}
    - {name: Healthcare,   basket: [WELL, VTR, OHI, DOC]}
    - {name: Housing,      basket: [AVB, EQR, MAA, INVH]}
    - {name: Retail,       basket: [SPG, O, KIM, REG]}
    - {name: Tourism,      basket: [HST, PK, RHP, APLE]}
    - {name: Office,       basket: [BXP, VNO, SLG, KRC]}

  加密幣:
    - {name: BTC, ticker: "BTC-USD", mcap: true}
    - {name: ETH, ticker: "ETH-USD", mcap: true}

  # 一律用「該貨幣兌美元」的期貨，方向與 Finviz 一致：
  # 數字為正 = 該貨幣升值 = 美元走弱
  貨幣:
    - {name: USD, ticker: "DX-Y.NYB", proxy: UUP, note: 方向相反，正值代表美元升}
    - {name: EUR, ticker: "6E=F", proxy: FXE}
    - {name: JPY, ticker: "6J=F", proxy: FXY}
    - {name: GBP, ticker: "6B=F", proxy: FXB}
    - {name: CAD, ticker: "6C=F", proxy: FXC}
    - {name: CHF, ticker: "6S=F", proxy: FXF}
    - {name: NZD, ticker: "6N=F"}   # 無合適 ETF，僅有 % 變化
    - {name: AUD, ticker: "6A=F", proxy: FXA}

  能源:
    - {name: Crude Oil WTI,   ticker: "CL=F", proxy: USO, note: 北美供需與美國本土經濟熱度}
    - {name: Crude Oil Brent, ticker: "BZ=F", proxy: BNO, note: 全球需求、地緣風險與 OPEC+ 政策}
    - {name: Natural Gas,     ticker: "NG=F", proxy: UNG}
    - {name: Heating Oil,     ticker: "HO=F", note: 柴油/物流/冬季供暖}
    - {name: Gasoline RBOB,   ticker: "RB=F", proxy: UGA, note: 終端出行與零售通膨}
    # Ethanol 無穩定的公開報價來源，若要看可用玉米(ZC=F)當代理

  穀物:
    - {name: Soybean, ticker: "ZS=F", proxy: SOYB}
    - {name: Corn,    ticker: "ZC=F", proxy: CORN}
    - {name: Wheat,   ticker: "ZW=F", proxy: WEAT}
    - {name: Sugar,   ticker: "SB=F", proxy: CANE}
    # Coffee 原本用 JO (iPath 咖啡 ETN) 當金額基準，該檔已下市，
    # 沒有替代的咖啡 ETF，所以這一列只有 % 變化、沒有金額。
    - {name: Coffee,  ticker: "KC=F"}
    - {name: Cocoa,   ticker: "CC=F"}
