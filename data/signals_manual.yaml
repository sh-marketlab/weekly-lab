# 訊號紀錄的手填欄位（第 4 點「投資理由被推翻」等判斷要你自己標）
# 用法：以「代號: 欄位」填寫（套用在該檔最新一筆訊號；要指定某一筆就寫「代號@週」，例如 BKSY@2026-W45），存檔後下次排程就會顯示在 contrarian.html 的訊號紀錄表。
#   held          有沒有建倉（true / false）
#   thesis        建倉理由（一句話）
#   thesis_broken 理由被推翻的日期（例：2026-12-03），有填就顯示「手動出場」
#   note          其他備註
#
# 範例：
# BKSY:
#   held: true
#   thesis: 板塊下跌時逆勢放量，查無明顯消息
#   thesis_broken:
#   note: 小部位試單

{}
