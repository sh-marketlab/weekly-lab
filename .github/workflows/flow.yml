name: 量價資金流

on:
  schedule:
    # 美股收盤後：週一～週五 22:30 UTC = 台灣隔天 06:30
    - cron: "30 22 * * 1-5"
    # 週六重抓一次：週六 14:00 UTC = 台灣週六 22:00 = 美東週六上午。
    # 週五收盤後馬上抓時，Yahoo 的成交量常還沒定稿（場外 ADR 如 CFRUY、HESAY 最明顯），
    # 每次都會重抓整年資料，所以這次會用定稿數字覆蓋週五那一天。
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 計算量價資金流
        run: python src/flow.py

      - name: 提交
        run: |
          git config user.name  "weekly-lab-bot"
          git config user.email "actions@github.com"
          git add docs/flow.json docs/flow_ext.json
          git diff --staged --quiet && exit 0
          git commit -m "量價資金流 $(date -u +%F)"
          # 跟 weekly.yml 錯開時間，但保險起見推送前先同步
          git pull --rebase origin main
          git push
