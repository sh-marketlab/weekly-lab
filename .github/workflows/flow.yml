name: 量價資金流

on:
  schedule:
    # 美股收盤後：週一～週五 23:47 UTC = 台灣隔天 07:47（美東冬令 18:47／夏令 19:47）。
    # 刻意晚於收盤約 3 小時，讓 Yahoo 的當日成交量多數已定稿；
    # 分鐘數避開 :00／:30，因為整點、半點是 GitHub 排程最塞、延遲最久的時段。
    # 還沒定稿的少數（場外 ADR）會在隔天那趟重抓整年資料時被覆蓋。
    - cron: "47 23 * * 1-5"
    # 週六重抓一次：週六 13:43 UTC = 台灣週六 21:43 = 美東週六上午。
    # 週五收盤後馬上抓時，Yahoo 的成交量常還沒定稿（場外 ADR 如 CFRUY、HESAY 最明顯），
    # 每次都會重抓整年資料，所以這次會用定稿數字覆蓋週五那一天。
    - cron: "43 13 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 計算量價資金流
        run: python src/flow.py

      - name: 提交
        run: |
          git config user.name  "weekly-lab-bot"
          git config user.email "actions@github.com"
          git add docs/flow.json docs/flow_ext.json docs/contrarian.json data/signals.json docs/divergence.json
          git diff --staged --quiet && exit 0
          git commit -m "量價資金流 $(date -u +%F)"
          # 跟 weekly.yml 錯開時間，但保險起見推送前先同步
          git pull --rebase origin main
          git push
